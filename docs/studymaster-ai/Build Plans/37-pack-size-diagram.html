<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Build 37 — Pack size</title>
  <style>
    body { margin: 0; background: #f6f3ec; color: #1c1917; font-family: "Segoe UI", sans-serif; }
    main { width: 920px; padding: 28px; }
    h1 { font-size: 30px; margin: 0 0 6px; }
    .lead { margin: 0 0 16px; color: #57534e; }
    .box { background: #fffdf8; border: 2px solid #1c1917; border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
    .short { background: #e5f4ea; }
    .kicker { display: block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #57534e; margin-bottom: 4px; }
    h2 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0; font-size: 15px; }
    .down { text-align: center; font-size: 22px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Build 37 — Pack size</h1>
    <p class="lead">The minutes choose how many sections a new pack keeps.</p>

    <div class="box short">
      <span class="kicker">Up to 10 minutes</span>
      <h2>5 minutes or 10 minutes</h2>
      <p>Outline, study, and lesson</p>
    </div>
    <div class="down">↓</div>
    <div class="box">
      <span class="kicker">More than 10 minutes</span>
      <h2>15 minutes or 20 minutes</h2>
      <p>Outline, study, lesson, lab, project, and runbook</p>
    </div>
  </main>
</body>
</html>
