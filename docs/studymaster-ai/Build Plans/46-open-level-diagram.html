<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Build 46 — Open level</title>
  <style>
    body { margin: 0; background: #f6f3ec; color: #1c1917; font-family: "Segoe UI", sans-serif; }
    main { width: 920px; padding: 28px; }
    h1 { font-size: 30px; margin: 0 0 6px; }
    .lead { margin: 0 0 16px; color: #57534e; }
    .box { background: #fffdf8; border: 2px solid #1c1917; border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
    .level { background: #e7f0fb; }
    h2 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0; font-size: 15px; }
    .down { text-align: center; font-size: 22px; margin-top: 8px; }
    .kicker { display: block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #57534e; margin-bottom: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Build 46 — Open level</h1>
    <p class="lead">Under the pack title, the page names who the pack was written for.</p>

    <div class="box level">
      <span class="kicker">Open pack</span>
      <h2>Get started with identity architecture</h2>
      <p>Read from learn.microsoft.com</p>
      <p>For an intermediate learner</p>
    </div>
    <div class="down">↓</div>
    <div class="box">
      <span class="kicker">Pasted lesson</span>
      <h2>Pasted lesson</h2>
      <p>For a beginner</p>
      <p>The download stays the study text.</p>
    </div>
  </main>
</body>
</html>
